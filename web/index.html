<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בודקים לפני שלוחצים</title>
<meta name="description" content="הדביקו הודעה חשודה וקבלו רמת סיכון, סימני אזהרה ומה לעשות">
<meta name="theme-color" content="#0f3d3e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230f3d3e' d='M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --ink: #1c2321;
    --muted: #5d6763;
    --line: #e2ddd2;
    --brand: #0f3d3e;
    --brand-ink: #ffffff;
    --focus: #2f7d6d;
    --high: #c62828;   --high-bg: #fdecea;
    --medium: #b45309; --medium-bg: #fff4e0;
    --low: #4b5b57;    --low-bg: #eef1ef;
    --ok: #2e7d4f;
    --radius: 18px;
    --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 6px 24px rgb(0 0 0 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111615; --surface: #1a2120; --ink: #e9eeec; --muted: #a2adaa; --line: #2c3634;
      --brand: #7fd1bd; --brand-ink: #0b1514; --focus: #7fd1bd;
      --high: #ff8a80;   --high-bg: #3a1d1b;
      --medium: #ffb74d; --medium-bg: #3a2a14;
      --low: #b8c4c0;    --low-bg: #222b29;
      --ok: #81c995;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111615; --surface: #1a2120; --ink: #e9eeec; --muted: #a2adaa; --line: #2c3634;
    --brand: #7fd1bd; --brand-ink: #0b1514; --focus: #7fd1bd;
    --high: #ff8a80;   --high-bg: #3a1d1b;
    --medium: #ffb74d; --medium-bg: #3a2a14;
    --low: #b8c4c0;    --low-bg: #222b29;
    --ok: #81c995;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 17px/1.55 "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }

  header { display: flex; align-items: center; gap: 12px; margin: 8px 0 20px; }
  .logo { width: 44px; height: 44px; flex: none; border-radius: 14px; background: var(--brand);
          display: grid; place-items: center; color: var(--brand-ink); }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .tagline { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }

  .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
           border: 1px solid var(--line); padding: 16px; }

  label.title { display: block; font-weight: 500; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical; padding: 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
    font: inherit; line-height: 1.5; unicode-bidi: plaintext; text-align: start;
  }
  textarea:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px;
         color: var(--muted); font-size: .85rem; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 999px;
           padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; display: inline-flex;
           align-items: center; gap: 6px; min-height: 36px; }
  .ghost:hover { border-color: var(--muted); }

  .primary { width: 100%; margin-top: 14px; min-height: 54px; border: 0; border-radius: 14px;
             background: var(--brand); color: var(--brand-ink); font: inherit; font-size: 1.1rem;
             font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .primary:disabled { opacity: .6; cursor: progress; }
  .spinner { width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent;
             border-radius: 50%; animation: spin .7s linear infinite; display: none; }
  .primary[aria-busy="true"] .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .privacy { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: .85rem;
             margin: 12px 2px 0; }
  .privacy svg { flex: none; margin-top: 3px; }

  .examples { margin-top: 18px; }
  .examples h2 { font-size: .9rem; font-weight: 500; color: var(--muted); margin: 0 0 8px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chips button { flex: none; max-width: 230px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                  unicode-bidi: plaintext; }

  #result { margin-top: 20px; }
  #result:empty { display: none; }
  .verdict { border-radius: var(--radius); padding: 18px; border: 1px solid transparent; }
  .verdict.high { background: var(--high-bg); --c: var(--high); }
  .verdict.medium { background: var(--medium-bg); --c: var(--medium); }
  .verdict.low { background: var(--low-bg); --c: var(--low); }
  .verdict-head { display: flex; align-items: center; gap: 12px; }
  .verdict-icon { width: 48px; height: 48px; flex: none; border-radius: 50%; background: var(--c);
                  color: var(--surface); display: grid; place-items: center; }
  .verdict-title { font-size: 1.45rem; font-weight: 700; color: var(--c); margin: 0; line-height: 1.2; }
  .verdict-sub { margin: 2px 0 0; color: var(--ink); font-size: .95rem; }

  .section { margin-top: 16px; }
  .section h3 { font-size: 1rem; margin: 0 0 8px; }
  ul.signs, ol.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  ul.signs li { display: flex; gap: 10px; align-items: flex-start; background: var(--surface);
                border-radius: 12px; padding: 10px 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 8px; flex: none; background: var(--medium); }
  .dot.very_strong { background: var(--high); width: 12px; height: 12px; margin-top: 7px; }
  .dot.strong { background: var(--high); opacity: .75; }
  .dot.ok { background: var(--ok); }
  ol.steps { counter-reset: s; }
  ol.steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; }
  ol.steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%;
                        background: var(--c); color: var(--surface); font-weight: 700; font-size: .85rem;
                        display: grid; place-items: center; margin-top: 1px; }

  details { margin-top: 14px; background: var(--surface); border-radius: 12px; padding: 10px 14px; }
  summary { cursor: pointer; font-weight: 500; }
  details dl { margin: 10px 0 0; font-size: .9rem; }
  details dt { color: var(--muted); margin-top: 8px; }
  details dd { margin: 2px 0 0; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .85rem;
          direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }

  .error { background: var(--high-bg); color: var(--high); border-radius: 12px; padding: 12px 14px; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 28px; }

  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
    </div>
    <div>
      <h1>בודקים לפני שלוחצים</h1>
      <p class="tagline">קיבלתם הודעה חשודה? הדביקו אותה כאן.</p>
    </div>
  </header>

  <form class="panel" id="form" novalidate>
    <label class="title" for="text">ההודעה</label>
    <textarea id="text" name="text" maxlength="5000" required
      placeholder="הדביקו כאן את ההודעה, כולל הקישורים"></textarea>
    <div class="row">
      <button type="button" class="ghost" id="paste" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        הדבקה
      </button>
      <button type="button" class="ghost" id="clear">ניקוי</button>
      <span id="count" dir="ltr">0 / 5000</span>
    </div>
    <button type="submit" class="primary" id="submit">
      <span class="spinner" aria-hidden="true"></span>
      <span>בדיקה</span>
    </button>
    <p class="privacy">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      ההודעה לא נשמרת ולא נשלחת לשום שירות חיצוני. הקישורים לא נפתחים.
    </p>
  </form>

  <section class="examples" aria-labelledby="ex-title">
    <h2 id="ex-title">רוצים לנסות? הודעות לדוגמה:</h2>
    <div class="chips" id="chips"></div>
  </section>

  <section id="result" aria-live="polite"></section>

  <footer>כלי עזר, לא ערובה. במקרה של ספק, פנו ישירות לגוף הרשמי דרך האתר או האפליקציה שלו.</footer>
</main>

<template id="tpl-result">
  <div class="verdict">
    <div class="verdict-head">
      <div class="verdict-icon" aria-hidden="true"></div>
      <div>
        <p class="verdict-title"></p>
        <p class="verdict-sub"></p>
      </div>
    </div>
    <div class="section signs-section">
      <h3 data-t="signs"></h3>
      <ul class="signs"></ul>
    </div>
    <div class="section ok-section">
      <h3 data-t="reassuring"></h3>
      <ul class="signs ok-list"></ul>
    </div>
    <div class="section">
      <h3 data-t="todo"></h3>
      <ol class="steps"></ol>
    </div>
    <details>
      <summary data-t="found"></summary>
      <dl></dl>
    </details>
  </div>
</template>

<script>
const T = {
  he: { signs: "סימני אזהרה", reassuring: "סימנים מרגיעים", todo: "מה לעשות", found: "מה מצאנו בהודעה",
        links: "קישורים (לא נפתחו)", phones: "מספרי טלפון", amounts: "סכומים", score: "ציון המודל",
        nothing: "לא נמצאו קישורים, טלפונים או סכומים",
        sub: { high: "יש כאן כמה סימנים מובהקים של הונאה.", medium: "יש סימנים שכדאי לבדוק לפני שעושים משהו.",
               low: "לא מצאנו סימנים מוכרים של הונאה." } },
  en: { signs: "Warning signs", reassuring: "Reassuring signs", todo: "What to do", found: "What we found",
        links: "Links (not opened)", phones: "Phone numbers", amounts: "Amounts", score: "Model score",
        nothing: "No links, phone numbers or amounts found",
        sub: { high: "There are clear signs of a scam here.", medium: "There are signs worth checking before you act.",
               low: "We didn't find known scam signs." } },
};
const ICON = {
  high: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v6"/><path d="M12 17h.01"/></svg>',
  medium: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v6"/><path d="M12 17h.01"/></svg>',
  low: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.3-4.3"/></svg>',
};

const $ = (s, el = document) => el.querySelector(s);
const form = $("#form"), text = $("#text"), submit = $("#submit"), result = $("#result");

function li(content, dotClass) {
  const item = document.createElement("li");
  const dot = document.createElement("span");
  dot.className = "dot " + dotClass;
  const span = document.createElement("span");
  span.textContent = content;          // always textContent: message text is never HTML
  item.append(dot, span);
  return item;
}

function render(r) {
  const lang = r.language, t = T[lang];
  const node = $("#tpl-result").content.cloneNode(true);
  const card = $(".verdict", node);
  card.classList.add(r.risk_level);
  card.dir = lang === "he" ? "rtl" : "ltr";
  card.lang = lang;
  node.querySelectorAll("[data-t]").forEach(h => h.textContent = t[h.dataset.t]);
  $(".verdict-icon", node).innerHTML = ICON[r.risk_level];   // fixed SVG, not user data
  $(".verdict-title", node).textContent = r.risk_text[lang];
  $(".verdict-sub", node).textContent = t.sub[r.risk_level];

  const signs = $(".signs", node);
  r.red_flags.forEach(s => signs.append(li(s[lang], s.strength)));
  if (!r.red_flags.length) $(".signs-section", node).remove();

  const ok = $(".ok-list", node);
  r.reassuring.forEach(s => ok.append(li(s[lang], "ok")));
  if (!r.reassuring.length) $(".ok-section", node).remove();

  const steps = $(".steps", node);
  r.what_to_do.forEach(a => { const i = document.createElement("li"); i.textContent = a; steps.append(i); });

  const dl = $("dl", node);
  const add = (label, values, mono) => {
    if (!values.length) return;
    const dt = document.createElement("dt"); dt.textContent = label;
    dl.append(dt);
    values.forEach(v => { const dd = document.createElement("dd"); dd.textContent = v;
                          if (mono) dd.className = "mono"; dl.append(dd); });
  };
  const f = r.found;
  add(t.links, f.links.map(l => l.url), true);
  add(t.phones, f.phones, true);
  add(t.amounts, f.amounts, false);
  if (!f.links.length && !f.phones.length && !f.amounts.length) add(t.found, [t.nothing], false);
  add(t.score, [r.model_score.toFixed(2)], true);

  result.replaceChildren(node);
  result.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

function showError(msg) {
  const d = document.createElement("div");
  d.className = "error"; d.setAttribute("role", "alert"); d.textContent = msg;
  result.replaceChildren(d);
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const value = text.value.trim();
  if (!value) { text.focus(); showError("הדביקו הודעה קודם."); return; }
  submit.disabled = true; submit.setAttribute("aria-busy", "true");
  try {
    const res = await fetch("/api/check", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: value }),
    });
    if (!res.ok) throw new Error(res.status === 503 ? "המודל עדיין לא אומן." : "משהו השתבש. נסו שוב.");
    render(await res.json());
  } catch (e) {
    showError(e.message.startsWith("Failed") ? "אין חיבור לשרת. נסו שוב." : e.message);
  } finally {
    submit.disabled = false; submit.removeAttribute("aria-busy");
  }
});

const count = $("#count");
const updateCount = () => count.textContent = `${text.value.length} / 5000`;
text.addEventListener("input", updateCount);

$("#clear").addEventListener("click", () => { text.value = ""; updateCount(); result.replaceChildren(); text.focus(); });

if (navigator.clipboard?.readText) {
  const paste = $("#paste");
  paste.hidden = false;
  paste.addEventListener("click", async () => {
    try { text.value = await navigator.clipboard.readText(); updateCount(); text.focus(); }
    catch { text.focus(); }
  });
}

fetch("/api/examples").then(r => r.ok ? r.json() : []).then(list => {
  const chips = $("#chips");
  list.forEach(ex => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "ghost"; b.textContent = ex.text; b.title = ex.text;
    b.addEventListener("click", () => { text.value = ex.text; updateCount(); form.requestSubmit(); });
    chips.append(b);
  });
  if (!list.length) $(".examples").remove();
}).catch(() => $(".examples").remove());
</script>
</body>
</html>
